<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--pink:#F388C0;--lime:#E4FB00;--ink:#0b0b0b}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1000px;height:970px;overflow:hidden;background:var(--pink);font-family:Outfit;position:relative}
.logo{position:absolute;left:44px;top:40px;height:96px}
h1{position:absolute;left:44px;top:170px;font-family:'Archivo Black';text-transform:uppercase;font-size:92px;line-height:.92;color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:8px 9px 0 var(--ink)}
.sub{position:absolute;left:48px;top:385px;font-size:32px;font-weight:600}
.row{position:absolute;left:44px;right:44px;top:450px;display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.card{background:#fff;border:5px solid var(--ink);border-radius:28px;box-shadow:9px 10px 0 var(--ink);height:360px;overflow:hidden;display:flex;flex-direction:column}
.im{flex:1;background-size:cover;background-position:center 30%}
.lab{padding:14px 16px;border-top:5px solid var(--ink);display:flex;justify-content:space-between;align-items:center}
.lab span{font-family:'Archivo Black';font-size:28px;text-transform:uppercase}
.pill{font-style:normal;background:var(--lime);border:4px solid var(--ink);border-radius:999px;padding:4px 14px;font-weight:800;font-size:24px}
.bar{position:absolute;left:0;right:0;bottom:0;height:110px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;gap:20px;font-size:34px;font-weight:600}
.bar .pill{color:var(--ink);font-size:28px}
</style></head><body>
<img class="logo" src="circuit_logo.png">
<h1>Fresh for the<br>dancefloor.</h1>
<div class="sub">Pick a scent. Tap your card. £1.50.</div>
<div class="row">
<div class="card"><div class="im" style="background-image:url(bottle1.jpg)"></div><div class="lab"><span>Fresh</span><i class="pill">£1.50</i></div></div>
<div class="card"><div class="im" style="background-image:url(bottle2.jpg)"></div><div class="lab"><span>Sweet</span><i class="pill">£1.50</i></div></div>
<div class="card"><div class="im" style="background-image:url(bottle3.jpg)"></div><div class="lab"><span>Warm</span><i class="pill">£1.50</i></div></div>
</div>
<div class="bar">Swipe for more scents →</div>
</body></html>
